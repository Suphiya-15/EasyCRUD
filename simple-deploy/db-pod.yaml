apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: easy-crud-db
  template:
    metadata:
      labels:
        app: easy-crud-db
    spec:
      containers:
        - name: mysql-container
          image: mariadb:latest
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: cloudblitz
            - name: MYSQL_DATABASE
              value: student_db
---
apiVersion: v1
kind: Service
metadata:
  name: db-svc
spec:
  selector:
    app: easy-crud-db
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
